name: pubmed_mobile
description: "A mobile PubMed literature search client."
publish_to: "none"
version: 0.2.0+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Network
  dio: ^5.9.1

  # Data Model
  freezed_annotation: ^3.1.0

  # Local Storage
  drift: ^2.35.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.3.4

  # WebView
  flutter_inappwebview: ^6.2.0-beta.3

  # Router
  go_router: ^17.1.0

  # UI
  shimmer: ^3.0.0
  flutter_svg: ^2.1.0

  # Utils
  xml: ^6.6.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  dynamic_color: ^1.8.1
  path: ^1.9.1
  sqlite3: ^3.5.2
  google_mlkit_translation: 0.14.0
  aptabase_flutter: ^0.5.0
  package_info_plus: ^9.0.1
  flutter_native_splash: ^2.4.7
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.11.0
  freezed: ^4.0.2
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage_platform_interface: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
